# RADAR v7 — stack completo. Solo backend+frontend son necesarios hoy;
# postgres/redis/neo4j/elasticsearch quedan listos para las siguientes fases.
services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["5001:5001"]
  frontend:
    image: nginx:alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]
    depends_on: [backend]
  postgres:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: radar, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}, POSTGRES_DB: radar }
    volumes: ["pg:/var/lib/postgresql/data"]
    profiles: ["data"]
  redis:
    image: redis:7-alpine
    profiles: ["data"]
  neo4j:
    image: neo4j:5
    environment: { NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-change-me-now}" }
    ports: ["7474:7474"]
    profiles: ["data"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment: { discovery.type: single-node, xpack.security.enabled: "true", ELASTIC_PASSWORD: "${ES_PASSWORD:-change-me}" }
    profiles: ["data"]
volumes: { pg: {} }
